    <h1>东川区红土地主页</h1>
    <p>东川红土地被誉为“大地的调色盘”，位于昆明市东川区。这片因土壤富含铁、铝而呈现炫目赤红的土地，是世界公认最具气势的红土地之一，位列中国四大色彩旅游天堂。</p>

    <h2>红土地的历史</h2>
    <p>东川红土地源于亿万年铁铝氧化，古代为“天南铜都”，千年采冶致红土裸露；上世纪90年代被摄影师发现，现为世界级摄影圣地。</p>

    <h2>红土地的色彩</h2>
    <ul>
        <li>赤红炫目</li>
        <li>色块交织</li>
        <li>光影瞬息</li>
    </ul>
