<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市气象数据整合中心</title>
  <link rel="icon" href="data:,">
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#home">城市气象数据整合中心</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="#home">首页</a>
        <a class="nav-link" href="#query">城市查询</a>
        <a class="nav-link" href="#board">数据看板</a>
        <a class="nav-link" href="three-d/globe.html">三维地球</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="home" class="mb-5">
      <h1 class="h3">城市气象数据整合中心</h1>
      <p class="text-muted" id="sub-title">期末大作业原型 · 数据来源：加载中</p>
      <p id="status" class="alert alert-warning" style="display:none"></p>
      <div class="row g-3" id="summary-cards" aria-live="polite"></div>
    </section>

    <section id="query" class="mb-5">
      <h2 class="h5 mb-3">城市查询</h2>
      <div class="row g-2 align-items-end mb-3" id="query-controls">
        <div class="col-12 col-md-auto">
          <span class="form-label d-block mb-1">城市</span>
          <div id="city-filter" class="btn-group btn-group-sm flex-wrap" role="group" aria-label="城市筛选"></div>
        </div>
        <div class="col-12 col-sm-6 col-md-auto">
          <label for="period-filter" class="form-label mb-1">时段</label>
          <select id="period-filter" class="form-select form-select-sm"></select>
        </div>
        <div class="col-12 col-md-auto ms-md-auto">
          <a id="globe-link" class="btn btn-sm btn-outline-secondary" href="three-d/globe.html">
            在三维地球上查看 →
          </a>
        </div>
      </div>
      <div class="row g-3" id="city-list"></div>
    </section>

    <section id="board" class="mb-5">
      <h2 class="h5 mb-3">数据看板</h2>
      <div class="row g-3">
        <div class="col-lg-7">
          <h3 class="h6">各月降水量对比</h3>
          <div id="bar-chart" style="height:360px"></div>
        </div>
        <div class="col-lg-5">
          <h3 class="h6">月平均气温趋势</h3>
          <div id="line-box" style="height:360px">
            <canvas id="line-chart"></canvas>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center text-muted py-4">
    软件开发综合实践 · 期末大作业原型 · 数据来源：自建数据集
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
