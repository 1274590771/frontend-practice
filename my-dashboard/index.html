<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
    .city-card.is-active { outline: 2px solid #0d6efd; }
  </style>
</head>
<body class="container py-4">
  <header class="mb-3">
    <h1 class="h3">城市天气数据看板</h1>
    <p class="text-muted mb-0" id="sub-title">数据来源：自建数据集</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <section class="row g-3 mb-4" id="cards"></section>

  <div id="city-filter" class="btn-group mb-3" role="group" aria-label="城市筛选"></div>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各城市月降水量对比（ECharts 柱状图）</h2>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">各城市月平均气温趋势（Chart.js 折线图）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
